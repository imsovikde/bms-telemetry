name: Feature Request
description: Propose an architectural enhancement, new hardware platform, or new OS driver
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement to **BMS Telemetry**.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific hardware limitation, ACPI table, or OS boundary?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Architecture
      description: Detailed description of how this should be implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative designs, tools, or workarounds you have evaluated.
    validations:
      required: false
